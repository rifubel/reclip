[package]
name = "reclip"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ashpd = { version = "0.14", default-features = false, features = ["global_shortcuts", "notification", "backend", "async-io"] }
futures = "0.3"
async-io = "1"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
gtk4 = { version = "0.11", features = ["v4_8", "v4_10", "v4_12"] }
